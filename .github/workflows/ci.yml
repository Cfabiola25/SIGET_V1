name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_mysql, bcmath, gd
          coverage: none

      - name: Install Composer dependencies
        run: |
          cd src
          composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: |
          cd src
          php artisan test
