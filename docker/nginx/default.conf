server {
    listen 80;
    listen [::]:80;
    index index.php index.html;
    server_name localhost;
    root /var/www/html/public;

    # Gzip Compression for maximum speed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2;

    client_max_body_size 64M;

    # Static Assets Fast Caching
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Service Worker & PWA Manifest (no-cache for instant updates)
    location ~* (?:sw\.js|manifest\.json)$ {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Main Application
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Server-Sent Events (SSE) streaming support
    location ~* /matches/\d+/stream {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffering off;
        fastcgi_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        fastcgi_read_timeout 3600s;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}