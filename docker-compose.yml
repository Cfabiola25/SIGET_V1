services:
  # Contenedor 1: Proxy Inverso y Servidor Web (Nginx)
  web:
    image: nginx:alpine
    container_name: siget_web
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # Contenedor 2: App Server (PHP-FPM + Laravel)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: siget_app
    volumes:
      - ./src:/var/www/html
      - ./docker/php/conf.d/performance.ini:/usr/local/etc/php/conf.d/99-performance.ini:ro
      - laravel_views:/var/www/html/storage/framework/views
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache && exec php-fpm"
    restart: unless-stopped

  # Contenedor 3: Base de Datos (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: siget_db
    environment:
      MYSQL_DATABASE: siget_sf
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:
  laravel_views: